# G4f.dev Workflow Update Translation And Ui Workflow

## Action

Follow the update-translation-and-ui-workflow workflow:
1. Edit or add translation keys in snippets.json.
2. Update translations.js to handle new or changed keys.
3. Modify UI components in components.js to use updated translations.
4. Update router.js or store.js if navigation/state is affected.
5. Adjust index.html if necessary for UI changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: playground/js/snippets.json, playground/js/translations.js, playground/js/components.js

